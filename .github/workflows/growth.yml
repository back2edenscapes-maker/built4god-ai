name: Marketer and growth review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
concurrency:
  group: built4god-state
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMMERCE_SITE_URL: ${{ vars.COMMERCE_SITE_URL }}
      COMMERCE_REPORT_TOKEN: ${{ secrets.COMMERCE_REPORT_TOKEN }}
      COMMERCE_SITE_SERVICE_TOKEN: ${{ secrets.COMMERCE_SITE_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Research and draft for review
        run: python -m built4god.marketer run
      - name: Verify aggregate metrics and checkout readiness
        run: python -m built4god.growth
      - name: Save research and aggregate reviews
        if: always()
        run: |
          git config user.name 'built4god-bot'
          git config user.email 'built4god-bot@users.noreply.github.com'
          git add data/marketer.sqlite3 output/marketing output/growth
          if ! git diff --cached --quiet; then
            git commit -m 'Update reviewed-queue research and aggregate growth report'
            git push origin HEAD:main
          fi
