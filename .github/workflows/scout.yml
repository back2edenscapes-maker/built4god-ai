name: Scout and Builder
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: built4god-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify engine
        run: python -m unittest discover -s tests -v
      - name: Research and draft
        run: python -m built4god run
      - name: Preserve research state
        if: always()
        run: |
          git config user.name 'built4god-bot'
          git config user.email 'built4god-bot@users.noreply.github.com'
          git add data output
          if ! git diff --cached --quiet; then
            git commit -m 'Update Scout evidence and product drafts'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: scout-and-builder-${{ github.run_id }}
          path: output/
          retention-days: 14
